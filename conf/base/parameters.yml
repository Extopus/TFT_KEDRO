# ================================
# TFT Kedro Project Parameters
# ================================
# Parámetros de configuración para el proyecto TFT
# ================================

# Configuración de datos
data_config:
  raw_data_path: "data/01_raw"
  intermediate_data_path: "data/02_intermediate"
  primary_data_path: "data/03_primary"
  feature_data_path: "data/04_feature"
  model_input_path: "data/05_model_input"
  
  # Datasets disponibles
  datasets:
    - "TFT_Challenger_MatchData"
    - "TFT_Grandmaster_MatchData"
    - "TFT_Platinum_MatchData"

# Configuración de pipelines
pipelines:
  business_understanding:
    enabled: true
    output_stats: true
    
  data_cleaning:
    enabled: true
    remove_duplicates: true
    handle_missing_values: "drop"
    
  feature_engineering:
    enabled: true
    create_derived_features: true
    normalize_features: true

# Configuración de Machine Learning
ml_config:
  # Targets identificados
  targets:
    classification:
      name: "rank_prediction"
      classes: ["Challenger", "Grandmaster", "Platinum"]
      description: "Predicción del rango del jugador"
      
    regression:
      name: "placement_prediction"
      range: [1, 8]
      description: "Predicción del placement en partidas"
  
  # Features principales (basadas en columnas disponibles)
  features:
    numerical:
      - "gameDuration"
      - "level"
      - "lastRound"
      - "ingameDuration"
      - "gameDuration_min"
      
    categorical:
      - "combination"
      - "champion"
      
  # Configuración de modelos
  models:
    test_size: 0.2
    random_state: 42
    cv_folds: 5
    output_path: "data/models"
    
  # Configuración de algoritmos
  classification_config:
    models:
      - "RandomForest"
      - "GradientBoosting"
      - "LogisticRegression"
      - "SVC"
      - "KNN"
      - "DecisionTree"
      - "MLP"
    hyperparameters:
      RandomForest:
        n_estimators: 100
        max_depth: null
      GradientBoosting:
        n_estimators: 100
        learning_rate: 0.1
      LogisticRegression:
        max_iter: 1000
        C: 1.0
      SVC:
        kernel: "rbf"
        probability: true
      KNN:
        n_neighbors: 5
      DecisionTree:
        max_depth: null
      MLP:
        hidden_layer_sizes: [100, 50]
        max_iter: 1000
    test_size: 0.2
    cv_folds: 5
    random_state: 42
    
  regression_config:
    models:
      - "RandomForest"
      - "GradientBoosting"
      - "LinearRegression"
      - "Ridge"
      - "Lasso"
      - "SVR"
      - "KNN"
      - "DecisionTree"
      - "MLP"
    hyperparameters:
      RandomForest:
        n_estimators: 100
        max_depth: null
      GradientBoosting:
        n_estimators: 100
        learning_rate: 0.1
      LinearRegression: {}
      Ridge:
        alpha: 1.0
      Lasso:
        alpha: 1.0
      SVR:
        kernel: "rbf"
      KNN:
        n_neighbors: 5
      DecisionTree:
        max_depth: null
      MLP:
        hidden_layer_sizes: [100, 50]
        max_iter: 1000
    test_size: 0.2
    cv_folds: 5
    random_state: 42

# Configuración de visualizaciones
visualization:
  figure_size: [12, 8]
  style: "seaborn"
  interactive: true
  save_plots: true
  plots_path: "plots"

# Configuración de Aprendizaje No Supervisado
unsupervised_config:
  # Columnas a excluir del clustering/reducción dimensional
  exclude_columns:
    - "gameId"
    - "rank"
    - "Ranked"
  
  # Configuración de Clustering
  clustering:
    # Rango de K para método Elbow
    k_range: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    
    # K-Means
    kmeans_n_clusters: 3
    kmeans_random_state: 42
    
    # DBSCAN
    dbscan_eps: 0.5
    dbscan_min_samples: 5
    
    # Hierarchical
    hierarchical_n_clusters: 3
    hierarchical_linkage: "ward"  # ward, complete, average
  
  # Configuración de Reducción Dimensional
  dimensionality_reduction:
    # PCA
    pca_n_components: null  # null = todos los componentes
    
    # t-SNE
    tsne_n_components: 2
    tsne_perplexity: 30
    tsne_n_iter: 1000
    tsne_max_samples: 10000  # Para datasets grandes
    
    # UMAP (opcional)
    umap_n_components: 2
    umap_n_neighbors: 15
    umap_min_dist: 0.1
  
  # Random state general
  random_state: 42

# Configuración de logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/tft_kedro.log"
